import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        // reproduko: libmpv LGPL-2.1+ propio (mpv 0.41.0, FFmpeg 8.0.3), Release
        // libmpv-lgpl-r1 del fork. REPRODUKO_LIBMPV_BASE_URL (p. ej. file:///.../dist)
        // sustituye la URL base para probar binarios locales; el hash no cambia.
        def libmpvBase = System.getenv("REPRODUKO_LIBMPV_BASE_URL") ?: "https://github.com/sinergiabarcelona/media-kit/releases/download/libmpv-lgpl-r1"
        def filesToDownload = [
            ["url": "${libmpvBase}/full-arm64-v8a.jar", "sha256": "5e7521e57d6405c9026b5492c6c928a3f8e0a9c82d4f933935f94acea741aec2", "destination": file("$buildDir/lgpl-r1/full-arm64-v8a.jar")],
            ["url": "${libmpvBase}/full-armeabi-v7a.jar", "sha256": "6be2439e35664a62d6bd79ad36d65ac95f1ed6f55e3cb76c8cdda31132c92b02", "destination": file("$buildDir/lgpl-r1/full-armeabi-v7a.jar")],
            ["url": "${libmpvBase}/full-x86_64.jar", "sha256": "1626afe30713ed031a79fe1b22838f9af508c1ba1de6e97aab10d433bb8f48da", "destination": file("$buildDir/lgpl-r1/full-x86_64.jar")],
            ["url": "${libmpvBase}/full-x86.jar", "sha256": "cab521850af1d9eef7c50839f1cc16c2a71de978b8787944d30b29f231088fce", "destination": file("$buildDir/lgpl-r1/full-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculated = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculated != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculated = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculated != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)