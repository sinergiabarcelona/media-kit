import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        // reproduko: libmpv LGPL-2.1+ propio (mpv 0.41.0, FFmpeg 8.0.3), Release
        // libmpv-lgpl-r2 del fork (sin decoders TrueHD, MLP, VVC, E-AC-3 ni DTS).
        // REPRODUKO_LIBMPV_BASE_URL (p. ej. file:///.../dist) sustituye la URL base
        // para probar binarios locales; el hash no cambia.
        def libmpvBase = System.getenv("REPRODUKO_LIBMPV_BASE_URL") ?: "https://github.com/sinergiabarcelona/media-kit/releases/download/libmpv-lgpl-r2"
        def filesToDownload = [
            ["url": "${libmpvBase}/full-arm64-v8a.jar", "sha256": "f110fe76197565e2f1bf84b70385bc3f9e79b718a57328b138ced41221fc42e5", "destination": file("$buildDir/lgpl-r2/full-arm64-v8a.jar")],
            ["url": "${libmpvBase}/full-armeabi-v7a.jar", "sha256": "163c2b48adebafa8e8421749de96ebc05fd337b02ca584dc344dac87fcf66c5d", "destination": file("$buildDir/lgpl-r2/full-armeabi-v7a.jar")],
            ["url": "${libmpvBase}/full-x86_64.jar", "sha256": "898074ce67212ea1a4fc6c7e3b2299ece37cb908a4be78d734f0c892887620fa", "destination": file("$buildDir/lgpl-r2/full-x86_64.jar")],
            ["url": "${libmpvBase}/full-x86.jar", "sha256": "17c205f1fc2f1975629ff04b196104963160142f3ddfba0948f3ae3d0248a0a8", "destination": file("$buildDir/lgpl-r2/full-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculated = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculated != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculated = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculated != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)