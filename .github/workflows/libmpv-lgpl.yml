# Copiar a .github/workflows/ del fork sinergiabarcelona/media-kit.
# Se activa al subir una etiqueta libmpv-lgpl-* o a mano. No publica nada fuera
# del propio repo: sube los binarios como artefactos/release del fork.
name: libmpv LGPL
on:
  workflow_dispatch:
    inputs:
      flavor: { description: "tiendas | completo", default: tiendas }
  push:
    tags: ["libmpv-lgpl-*"]
permissions:
  contents: write
jobs:
  linux:
    strategy: { matrix: { os: [ubuntu-24.04, ubuntu-24.04-arm] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm autoconf automake libtool pkg-config libva-dev libvdpau-dev libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev libx11-dev libwayland-dev libegl-dev libasound2-dev libpulse-dev python3-jinja2 python3-glad || sudo apt-get install -y meson ninja-build nasm autoconf automake libtool pkg-config libva-dev libvdpau-dev libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev libx11-dev libwayland-dev libegl-dev libasound2-dev libpulse-dev python3-jinja2
      - run: FLAVOR=${{ inputs.flavor || 'tiendas' }} reproduko/libmpv-lgpl/build-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: "libmpv-linux-${{ matrix.os }}", path: out/ }
  windows:
    strategy: { matrix: { arch: [x86_64, aarch64] } }
    runs-on: ubuntu-24.04
    container: mstorsjo/llvm-mingw:20241217
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y meson ninja-build nasm autoconf automake libtool pkg-config git python3-jinja2
      - run: ARCH=${{ matrix.arch }} FLAVOR=${{ inputs.flavor || 'tiendas' }} reproduko/libmpv-lgpl/build-windows.sh
      - uses: actions/upload-artifact@v4
        with: { name: "libmpv-windows-${{ matrix.arch }}", path: out/ }
  apple:
    strategy: { matrix: { platform: [tvos, visionos] } }
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install meson ninja nasm autoconf automake libtool pkg-config
      - run: PLATFORM=${{ matrix.platform }} FLAVOR=${{ inputs.flavor || 'tiendas' }} reproduko/libmpv-lgpl/build-apple.sh
      - uses: actions/upload-artifact@v4
        with: { name: "libmpv-${{ matrix.platform }}", path: out/ }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, apple]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - run: cd dist && for d in */; do tar czf "${d%/}.tar.gz" "$d"; done && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*.tar.gz\ndist/SHA256SUMS" }
